spring.application.name=FMS-SDPproject

# ---------------------------------------------------------------------------
# SERVER
# PORT is supplied by Render/Railway/Heroku at runtime. 9091 is the local default.
# ---------------------------------------------------------------------------
server.port=${PORT:9091}
server.servlet.session.timeout=30m

# DevTools' auto-restart watches target/classes for changes and restarts the
# app whenever it sees any. When the project is open in an IDE that also
# compiles Java in the background (VS Code's Java extension, IntelliJ, etc.),
# both processes can touch that folder at the same moment. DevTools then
# restarts against a half-rewritten classpath and throws confusing, unrelated
# -looking errors ("no DataSource", "0 repositories found", "bean not found")
# that have nothing to do with the actual code. Since this project is always
# started fresh with `mvnw spring-boot:run` rather than edited live while
# running, the auto-restart isn't needed - turning it off removes this whole
# class of false-alarm crash.
spring.devtools.restart.enabled=false

# Product images can be uploaded as base64 and submitted as a regular form
# field (not multipart), so the plain form-post size limit needs raising from
# Tomcat's 2MB default, or a photo upload fails silently.
server.tomcat.max-http-form-post-size=15MB
server.tomcat.max-swallow-size=15MB

# ---------------------------------------------------------------------------
# DATABASE
# NOTHING SECRET IS STORED IN THIS FILE. Set these as environment variables.
# Locally, copy .env.example to .env and load it, or set them in your IDE's
# run configuration.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning - free-tier MySQL hosts cap connections aggressively
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=280000

# ---------------------------------------------------------------------------
# JPA / HIBERNATE
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------------------------
# VIEW RESOLVER (JSP)
# ---------------------------------------------------------------------------
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp

# Let our own handler render 404/500 into error.jsp instead of the whitelabel page
server.error.whitelabel.enabled=false
spring.web.resources.add-mappings=true

# ---------------------------------------------------------------------------
# SEED ADMIN ACCOUNT
# Created on first startup if admin_table is empty. CHANGE THE PASSWORD.
# ---------------------------------------------------------------------------
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.email=${ADMIN_EMAIL:admin@farmconnect.local}
app.admin.name=${ADMIN_NAME:System Administrator}

# ---------------------------------------------------------------------------
# MAIL
# Set MAIL_ENABLED=false (the default) and the app runs fine without SMTP -
# mails are logged instead of sent. Turn it on only once you have set
# MAIL_USERNAME / MAIL_PASSWORD as environment variables.
# ---------------------------------------------------------------------------
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@farmconnect.local}}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.klu.jfsd=${APP_LOG_LEVEL:INFO}
