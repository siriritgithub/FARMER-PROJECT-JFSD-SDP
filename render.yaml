# Render Blueprint. Push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at the repo.
#
# Secrets are marked sync:false, so Render prompts you for them in the
# dashboard instead of storing them in git.
services:
  - type: web
    name: farmconnect
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /home
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: DDL_AUTO
        value: update
      - key: SHOW_SQL
        value: "false"
