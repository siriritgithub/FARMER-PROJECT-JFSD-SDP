# Local development: app + MySQL, one command.
#   docker compose up --build
# Then open http://localhost:9091/home
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: farmconnect
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9091:9091"
    environment:
      DB_URL: jdbc:mysql://db:3306/farmconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: rootpass
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin@123
      ADMIN_EMAIL: admin@farmconnect.local
      MAIL_ENABLED: "false"
      SHOW_SQL: "false"

volumes:
  dbdata:
